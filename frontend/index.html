<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#0d9488">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <title>MarketPlace — Vendeurs & Acheteurs</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="logo">🛒 MarketPlace</div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>La plateforme qui connecte vendeurs et acheteurs</h1>
      <p class="subtitle">Créez votre compte en quelques secondes et rejoignez notre marketplace.</p>
    </section>

    <div id="index-dynamic-nav" class="action-cards"></div>

    <div id="index-default-nav" class="action-cards">
      <a href="/register.html" class="action-card primary">
        <span class="action-icon">📝</span>
        <span class="action-title">Créer un compte</span>
        <span class="action-desc">Vendeur ou acheteur</span>
      </a>
      <a href="/login.html" class="action-card">
        <span class="action-icon">🔑</span>
        <span class="action-title">Se connecter</span>
        <span class="action-desc">Accéder à mon espace</span>
      </a>
      <a href="/admin.html" class="action-card admin">
        <span class="action-icon">📊</span>
        <span class="action-title">Espace Admin</span>
        <span class="action-desc">Gérer les utilisateurs</span>
      </a>
    </div>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
