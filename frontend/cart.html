<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#0d9488">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <title>Panier — MarketPlace</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="/" class="logo">🛒 MarketPlace</a>
    <nav class="nav-links">
      <a href="/marketplace.html" class="nav-link">Boutique</a>
      <a href="/cart.html" class="nav-link active">🛒 <span id="cart-badge" class="cart-badge">0</span></a>
      <a href="/orders.html" class="nav-link">Commandes</a>
      <button id="logout-btn" class="btn-ghost">Déconnexion</button>
    </nav>
  </header>

  <main class="container wide">
    <h1 class="page-title">Mon Panier</h1>

    <div id="cart-view">
      <div id="cart-items" class="cart-list"></div>

      <div id="cart-summary" class="cart-summary" style="display:none">
        <div class="cart-total">
          <span>Total</span>
          <span id="cart-total-amount">0 FC</span>
        </div>
        <div class="field" style="margin-top:16px">
          <label for="delivery-address">Adresse de livraison</label>
          <input type="text" id="delivery-address" placeholder="Adresse de livraison pour cette commande">
        </div>
        <button id="checkout-btn" class="btn-primary">Valider la commande</button>
        <p id="checkout-msg" class="form-msg"></p>
      </div>

      <div id="cart-empty" class="cart-empty" style="display:none">
        <p class="loading">Votre panier est vide.</p>
        <a href="/marketplace.html" class="btn-primary" style="display:inline-block;text-align:center;text-decoration:none;margin-top:12px">Parcourir la boutique</a>
      </div>
    </div>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
