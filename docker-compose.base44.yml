services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace_secret
      POSTGRES_DB: marketplace
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - DATABASE_URL=postgresql://marketplace:marketplace_secret@db:5432/marketplace
      - SECRET_KEY=base44-dev-secret-9f3a7c2e1b8d4f6a
      - ADMIN_EMAIL=admin@marketplace.com
      - ADMIN_PASSWORD=admin123
    command: ["sh", "-ec", "pip install --no-cache-dir -r backend/requirements.txt && exec uvicorn backend.main:app --host 0.0.0.0 --port 3000 --reload --reload-dir /app/backend"]
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: on-failure

volumes:
  pgdata:
